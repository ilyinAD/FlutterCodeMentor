openapi: 3.0.0
info:
  title: API
  version: "1.0"

paths:
  /auth/login:
    post:
      description: |
        Авторизация пользователя по email и паролю.
        При успехе возвращает данные пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /user:
    post:
      description: |
        Регистрация нового пользователя(ученик/учитель).
        Email должен быть уникальным в системе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /courses:
    get:
      description: |
        Получить список курсов.
        Если указан teacher_id — только курсы этого учителя.
        Если указан student_id — только курсы, на которые записан этот ученик.
        Параметры взаимоисключающие.
      parameters:
        - name: teacher_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      description: |
        Создать новый курс. Доступно только учителю.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreationRequest"
      responses:
        "201":
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /courses/{course_id}:
    get:
      description: |
        Получить детальную информацию о курсе по идентификатору.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{course_id}/tasks:
    get:
      description: |
        Получить список задач в курсе.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{course_id}/enrollments:
    post:
      description: |
        Записать ученика на курс. Идемпотентно: повторный вызов с тем же
        student_id возвращает существующую запись.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "200":
          description: Ученик уже был записан на этот курс.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      description: |
        Получить список учеников, записанных на курс. Доступно учителю курса.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /task:
    post:
      description: |
        Создать задачу для курса. Создать задачу может только учитель.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreationRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tasks/{task_id}:
    get:
      description: |
        Получить детальную информацию о задаче вместе со списком критериев.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{task_id}/submissions:
    get:
      description: |
        Получить список посылок по задаче.
        Учитель видит все посылки в задаче, ученик — только свои.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /submission:
    post:
      description: |
        Отправка посылки по задаче
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /submissions/{submission_id}:
    get:
      description: |
        Получить детальную информацию о посылке.
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /submissions/{submission_id}/reviews:
    get:
      description: |
        Получить AI-ревью посылки со списком всех замечаний.
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeReviewResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /submissions/{submission_id}/teacher-review:
    post:
      description: |
        Учитель принимает/отклоняет замечания AI и/или добавляет собственные.
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherReviewRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /submissions/{submission_id}/grade:
    put:
      description: |
        Выставить итоговую оценку ученику. Доступно только учителю.
        Переводит статус посылки в teacher_reviewed.
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      additionalProperties: false

    SubmissionRequest:
      type: object
      required:
        - task_id
        - user_id
        - submission_type
      properties:
        task_id:
          type: integer
          minimum: 1
        user_id:
          type: integer
          minimum: 1
        submission_type:
          type: string
          enum: [code, github_link]
        code:
          type: string
        github_url:
          type: string
          format: uri
          pattern: "^https://github.com/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)/?$"

    SubmissionResponse:
      type: object
      properties:
        submission_id:
          type: integer
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, ai_reviewed, teacher_reviewed]

    SubmissionDetailResponse:
      type: object
      properties:
        submission_id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: integer
        student_name:
          type: string
        submission_type:
          type: string
          enum: [code, github_link]
        code:
          type: string
        github_url:
          type: string
          format: uri
        status:
          type: string
          enum: [pending, ai_reviewed, teacher_reviewed]
        score:
          type: number
          format: float
          minimum: 0
        created_at:
          type: string
          format: date-time

    ValidationError:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    TaskCreationRequest:
      type: object
      required:
        - course_id
        - title
        - description
        - deadline
        - max_score
      properties:
        course_id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
          minLength: 10
        deadline:
          type: string
          format: date-time
        max_score:
          type: integer
          minimum: 1
          maximum: 100
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/TaskCriteriaRequest"
      additionalProperties: false

    TaskCriteriaRequest:
      type: object
      required:
        - criterion_name
        - criterion_description
        - weight
      properties:
        criterion_name:
          type: string
          minLength: 3
          maxLength: 100
        criterion_description:
          type: string
          minLength: 10
        is_mandatory:
          type: boolean
          default: true
        weight:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    TaskCriteriaResponse:
      type: object
      properties:
        id:
          type: integer
        criterion_name:
          type: string
        criterion_description:
          type: string
        is_mandatory:
          type: boolean
        weight:
          type: integer

    TaskDetailResponse:
      type: object
      properties:
        task_id:
          type: integer
        course_id:
          type: integer
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date-time
        max_score:
          type: integer
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/TaskCriteriaResponse"

    UserRegistrationRequest:
      type: object
      required:
        - email
        - password
        - role
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        role:
          type: string
          enum: [student, teacher]
        first_name:
          type: string
          minLength: 2
          maxLength: 50
        last_name:
          type: string
          minLength: 2
          maxLength: 50
      additionalProperties: false

    UserResponse:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [student, teacher, admin]
        first_name:
          type: string
        last_name:
          type: string
        created_at:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    CourseCreationRequest:
      type: object
      required:
        - title
        - start_date
        - teacher_id
      properties:
        teacher_id:
          type: integer
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        is_active:
          type: boolean
      additionalProperties: false

    CourseResponse:
      type: object
      properties:
        course_id:
          type: integer
        teacher_id:
          type: integer
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    EnrollmentRequest:
      type: object
      required:
        - student_id
      properties:
        student_id:
          type: integer
          minimum: 1
      additionalProperties: false

    EnrollmentResponse:
      type: object
      properties:
        course_id:
          type: integer
        student_id:
          type: integer
        student_name:
          type: string
        enrolled_at:
          type: string
          format: date-time

    CodeReviewResponse:
      type: object
      properties:
        id:
          type: integer
        submission_id:
          type: integer
        ai_model:
          type: string
        overall_status:
          type: string
          enum: [passed, failed, needs_improvement, pending]
        ai_confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        execution_time_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        feedbacks:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFeedbackResponse"

    ReviewFeedbackResponse:
      type: object
      properties:
        id:
          type: integer
        review_id:
          type: integer
        feedback_type:
          type: string
        file_path:
          type: string
        line_start:
          type: integer
          minimum: 1
        line_end:
          type: integer
          minimum: 1
        code_snippet:
          type: string
        suggested_fix:
          type: string
        description:
          type: string
        severity:
          type: integer
          minimum: 1
          maximum: 5
        is_resolved:
          type: boolean
          default: false
        teacher_comment:
          type: string
        teacher_approved:
          type: boolean
          nullable: true

    TeacherReviewRequest:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackAction"
        teacher_feedbacks:
          type: array
          items:
            $ref: "#/components/schemas/TeacherFeedbackRequest"
      additionalProperties: false

    FeedbackAction:
      type: object
      required:
        - feedback_id
      properties:
        feedback_id:
          type: integer
          minimum: 1
        teacher_approved:
          type: boolean
          nullable: true
        teacher_comment:
          type: string

    TeacherFeedbackRequest:
      type: object
      required:
        - description
        - severity
      properties:
        feedback_type:
          type: string
        file_path:
          type: string
        line_start:
          type: integer
          minimum: 1
        line_end:
          type: integer
          minimum: 1
        code_snippet:
          type: string
        suggested_fix:
          type: string
        description:
          type: string
          minLength: 1
        severity:
          type: integer
          minimum: 1
          maximum: 5

    GradeRequest:
      type: object
      required:
        - score
      properties:
        score:
          type: number
          format: float
          minimum: 0
        comment:
          type: string
      additionalProperties: false

  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    NotFound:
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: "Only teachers can create tasks"

    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
